name: Publish Nationwide Transit Feeds

on:
  schedule:
    # 03:15 UTC daily (05:15 Europe/Budapest CEST during summer, 04:15 CET during winter)
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      feed:
        description: 'Target Feed ID to sync (or "all" for nationwide discovery)'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run execution (validate candidates, no R2 mutations)'
        required: false
        type: boolean
        default: false

concurrency:
  group: feed-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Sync & Publish Feeds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification test suite
        run: npm test

      - name: Typecheck source code
        run: npm run typecheck

      - name: Run Feed Publisher
        env:
          MENETBRAND_API_KEY: ${{ secrets.MENETBRAND_API_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PUBLIC_FEED_BASE_URL: ${{ vars.PUBLIC_FEED_BASE_URL }}
          FEED_PUBLISHER_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: |
          if [ "${{ inputs.feed }}" != "" ] && [ "${{ inputs.feed }}" != "all" ]; then
            npm run sync -- --feed "${{ inputs.feed }}"
          else
            npm run sync
          fi
